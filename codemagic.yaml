# Codemagic CI/CD Configuration for Wolf Tap & Earn (Capacitor Android Build)
# This file automatically builds your React + Vite web app, wraps it into a native Android app,
# and generates both .apk (for direct phone installation) and .aab (for Play Store) files.

workflows:
  android-build:
    name: Wolf Tap Android Production Build (.apk & .aab)
    max_build_duration: 60
    instance_type: mac_mini_m1  # High performance macOS/Linux runner
    environment:
      groups:
        - keystore_credentials  # For secure code-signing keys (configure in Codemagic UI if needed)
      vars:
        JAVA_VERSION: "21"      # Required JDK version for modern Gradle and Android 14 builds
        NODE_VERSION: "22"      # Stable Node version for Vite build
      node: 22
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Set up Java 21
        script: |
          # Ensure Java 21 is active
          sdk use java 21.0.2-sem || sdk use java 21.0.2-tem || sdk use java 21.0.1-tem || echo "Java version already set or sdkman not available"
      - name: Install Node modules
        script: |
          npm ci
      - name: Build Web Application (React + Vite)
        script: |
          # This compiles our React source code into the static /dist directory
          npm run build
      - name: Sync with Android Native Platform (Capacitor)
        script: |
          # Copy compiled web assets from /dist to android/app/src/main/assets/public
          npx cap sync
      - name: Build Android Artifacts (APK & AAB)
        script: |
          # Ensure Java 21 is active in this step's shell session
          sdk use java 21.0.2-sem || sdk use java 21.0.2-tem || sdk use java 21.0.1-tem || echo "Using system Java default"
          
          cd android
          
          # Clean previous builds
          ./gradlew clean -Dorg.gradle.java.home="$JAVA_HOME"
          
          # Build Release APK (For direct phone testing)
          ./gradlew assembleRelease -Dorg.gradle.java.home="$JAVA_HOME"
          
          # Build Release AAB (Android App Bundle for Google Play Store)
          ./gradlew bundleRelease -Dorg.gradle.java.home="$JAVA_HOME"
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - mizaanm368@gmail.com
